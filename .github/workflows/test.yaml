name: test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: goto-bus-stop/setup-zig@v1
        with:
          version: 0.17.0

      - name: Install libcurl development package
        run: |
          sudo apt update
          sudo apt install libcurl4-openssl-dev pkg-config

      - name: build test bin
        run: zig build test --summary all

      - name: build test on ReleaseFast
        run: zig build -Doptimize=ReleaseFast test --summary all
